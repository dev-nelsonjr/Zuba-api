
services:
  db:
    container_name: db
    image: postgres:17.5
    restart: always
    ports:
      - $DB_PORT:5432
    environment:
     - POSTGRES_USER=$DB_USER
     - POSTGRES_PASSWORD=$DB_PASS
     - POSTGRES_DB=$DB_NAME

  cronjobs:
    container_name: cronjobs
    build:
      context: .
      dockerfile: Dockerfile.cron
    depends_on:
      - db
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    volumes:
      - ./src/jobs/.crontab:/usr/src/app/.crontab:ro
      - ./dist:/usr/src/app/dist
