name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zuba_testdb03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zuba_testdb03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SERVER_PORT: 9900
      JWT_SECRET: ci-test-secret
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: zuba
      DB_URL: postgresql://postgres:postgres@localhost:5432/zuba

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint:all

      - name: Run tests
        run: yarn test

      - name: Build API
        run: yarn build
